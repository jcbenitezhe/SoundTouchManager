name: SoundTouchManager
options:
  bundleIdPrefix: io.github.jcbenitezhe
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SoundTouchManager:
    type: application
    platform: iOS
    sources:
      - path: STManager
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jcbenitezhe.soundtouchmanager
        PRODUCT_NAME: SoundTouchManager
        INFOPLIST_FILE: STManager/Info.plist
        CODE_SIGN_ENTITLEMENTS: STManager/STManager.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: STManager/STManager-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Backend/include
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/Backend/iphoneos
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/Backend/iphonesimulator
        OTHER_LDFLAGS: [-lstmbackend, -lresolv]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - target: ShareExtension
        embed: true
    preBuildScripts:
      - name: Check Go backend
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$PROJECT_DIR/Backend/$PLATFORM_NAME/libstmbackend.a" ]; then
            echo "error: Go backend missing for $PLATFORM_NAME. Run 'make ios-backend' in the repository root."
            exit 1
          fi
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jcbenitezhe.soundtouchmanager.share
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
